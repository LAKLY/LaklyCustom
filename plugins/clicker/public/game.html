<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Кликер</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0A0E27; --panel: #0F1430; --panel-2: #141A3A;
    --border: rgba(0,245,255,.14);
    --cyan: #00F5FF; --pink: #FF006E; --text: #E6EAF5; --muted: #8A93B5;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; overflow: hidden;
  }
  .counter { font-size: clamp(40px, 12vw, 96px); font-weight: 700; color: var(--cyan); text-shadow: 0 0 40px var(--cyan); margin: 12px 0; transition: transform .08s; }
  .counter.pulse { transform: scale(1.08); }
  .click-btn {
    width: min(50vw, 220px); height: min(50vw, 220px); border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FF3A85, #FF006E);
    border: 4px solid rgba(255,255,255,.15);
    color: white; font-size: 24px; font-weight: 700; cursor: pointer;
    box-shadow: 0 0 60px rgba(255,0,110,.4);
    transition: transform .05s, box-shadow .2s;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .click-btn:active { transform: scale(.95); box-shadow: 0 0 90px rgba(255,0,110,.8); }
  .lb { margin-top: 16px; width: 100%; max-width: 320px; }
  .lb h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
  .lb-list { display: flex; flex-direction: column; gap: 3px; }
  .lb-row { display: flex; justify-content: space-between; padding: 6px 10px; background: var(--panel); border-radius: 5px; font-size: 13px; }
  .lb-row .score { color: var(--cyan); font-weight: 600; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
  <div class="counter" id="counter">0</div>
  <button class="click-btn" id="btn">КЛИК!</button>
  <div class="lb">
    <h3>Топ игроков</h3>
    <div class="lb-list" id="lb"><div style="color:var(--muted);font-size:12px;padding:6px 0;">Пока никто не кликал</div></div>
  </div>
  <p class="hint">Каждый клик приближает команду к общей цели</p>

<script>
  const $ = id => document.getElementById(id);
  const counter = $('counter');
  const lb = $('lb');
  const btn = $('btn');

  let player = null;

  // ─── Optimistic-счёт ────────────────────────────────────
  // Сервер шлёт GAME_STATE только после полного roundtrip'а через
  // Cloudflare + worker_threads — это 200-350мс. Чтобы клик
  // ощущался мгновенным, мы инкрементим цифру сразу локально,
  // а серверное значение используем как источник правды и выравниваем.
  //
  //  - serverCount — последнее подтверждённое сервером число
  //  - pending     — наши клики, ушедшие в сеть и ещё не отражённые
  //
  // Отображаем serverCount + pending. Никогда не откатываемся назад,
  // потому что отставание сети не должно выглядеть как «минус клик».
  let serverCount = 0;
  let pending = 0;
  let lastRendered = -1;

  window.parent.postMessage({ type: 'lakly:ready' }, '*');

  window.addEventListener('message', (e) => {
    if (!e.data || typeof e.data !== 'object') return;
    const { type, data } = e.data;

    if (type === 'lakly:init') {
      player = e.data.player;
    }

    if (type === 'lakly:state') {
      renderState(data);
    }
  });

  btn.addEventListener('click', () => {
    pending++;
    renderCounter();

    // Тактильный микро-фидбек: пульс идёт синхронно с цифрой.
    counter.classList.add('pulse');
    setTimeout(() => counter.classList.remove('pulse'), 80);

    window.parent.postMessage({ type: 'lakly:action', action: 'click' }, '*');
  });

  // Горячая клавиша Space — многие кликеры ждут именно её.
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      btn.click();
    }
  });

  function renderState(state) {
    if (!state) return;

    if (typeof state.count === 'number') {
      const delta = state.count - serverCount;

      // Сколько наших кликов реально подтверждено этим апдейтом.
      // Может быть и 0 (апдейт от чужого клика), и больше 1
      // (сервер «догнал» несколько наших кликов сразу).
      if (delta > 0) {
        pending = Math.max(0, pending - delta);
      } else if (delta < 0) {
        // Серверное состояние сброшено (например, Game Start). Доверяем ему.
        pending = 0;
      }

      serverCount = state.count;
      renderCounter();
    }

    if (Array.isArray(state.leaderboard)) {
      if (state.leaderboard.length === 0) {
        lb.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:6px 0;">Пока никто не кликал</div>';
      } else {
        lb.innerHTML = state.leaderboard.map((row, i) => `
          <div class="lb-row">
            <span class="name">${i + 1}. ${escapeHtml(row.name)}</span>
            <span class="score">${row.clicks}</span>
          </div>
        `).join('');
      }
    }
  }

  function renderCounter() {
    const display = serverCount + pending;
    if (display === lastRendered) return;
    lastRendered = display;
    counter.textContent = display;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
