<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LaklyCustom</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css?v=1.0.2">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<!-- ═══════════ JOIN ═══════════ -->
<div id="join-screen" class="screen">
  <div class="join-card">
    <img class="join-nika" src="/assets/nika/nika-welcome.png" alt=""
         onerror="this.style.display='none'">
    <h1 class="join-room-name" id="join-room-title">LaklyCustom</h1>
    <p class="join-sub">Введите имя — и вы в комнате</p>

    <div class="join-form" id="join-form">
      <input id="player-name" placeholder="Ваш ник" maxlength="20" autofocus autocomplete="off">
      <button id="btn-join" class="btn-join">Войти в комнату</button>
      <div id="join-error" class="error"></div>
    </div>

    <div class="join-footer">
      <img src="/assets/icon/icon-64.png" alt="" onerror="this.style.display='none'">
      <span>LaklyCustom · играем вместе</span>
    </div>
  </div>
</div>

<!-- ═══════════ ROOM ═══════════ -->
<div id="room-screen" class="screen" hidden>
  <div class="guest-app">
    <header class="guest-header">
      <div class="guest-brand">
        <img src="/assets/icon/icon-64.png" alt="" onerror="this.style.display='none'">
        <span>LaklyCustom</span>
      </div>
      <div class="guest-header-right">
        <span class="guest-status" title="Комната активна">
          <span class="guest-status-dot"></span>
          <span>Онлайн</span>
        </span>
        <span class="guest-self" id="player-self"></span>
      </div>
    </header>

    <div class="guest-players" id="players">
      <div class="muted-text" style="padding:8px 0;font-size:12px;">Пока никого</div>
    </div>

    <div class="guest-game" id="game-block" hidden>
      <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>

    <div class="guest-chat">
      <div id="chat" class="chat-list">
        <div class="muted-text">Сообщений пока нет</div>
      </div>
      <div class="chat-input-row">
        <input id="chat-input" placeholder="Написать сообщение…" maxlength="200">
        <button id="btn-send">→</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ CLOSED ═══════════ -->
<div id="closed-screen" class="screen" hidden>
  <div class="closed-card">
    <img src="/assets/nika/nika-sleep.png" alt="" onerror="this.style.display='none'">
    <h1>Комната закрыта</h1>
    <p>Хост завершил сессию</p>
  </div>
</div>

<script src="/client.js?v=1.0.2"></script>
</body>
</html>
